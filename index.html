<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAXSATORU ORACLE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3d1a78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAXSATORU ORACLE">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Noto+Serif+JP:wght@300;400;700&display=swap');

  :root {
    --navy: #0a0e2e;
    --deep-purple: #1a0a3e;
    --purple: #3d1a78;
    --violet: #6b2fa0;
    --gold: #d4af37;
    --gold-light: #f5d76e;
    --silver: #c0c0c0;
    --white: #f0eaf8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== 星空背景 ===== */
  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* 流れ星 */
  .shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: shoot var(--sd, 6s) ease-in infinite var(--sdelay, 0s);
  }
  .shooting-star::after {
    content: '';
    position: absolute;
    top: 0; right: 2px;
    width: 80px; height: 1px;
    background: linear-gradient(to left, white, transparent);
  }

  @keyframes shoot {
    0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(300px, 300px) rotate(-45deg); opacity: 0; }
  }

  /* 星雲エフェクト */
  .nebula {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    animation: nebula-pulse 8s ease-in-out infinite;
  }
  .nebula-1 { width: 600px; height: 600px; background: #6b2fa0; top: -200px; left: -200px; }
  .nebula-2 { width: 500px; height: 500px; background: #1a4fa0; bottom: -200px; right: -100px; animation-delay: 4s; }
  .nebula-3 { width: 300px; height: 300px; background: #a02f6b; top: 40%; left: 40%; animation-delay: 2s; }

  @keyframes nebula-pulse {
    0%, 100% { transform: scale(1); opacity: 0.12; }
    50% { transform: scale(1.1); opacity: 0.2; }
  }

  /* ===== レイアウト ===== */
  .container {
    position: relative;
    z-index: 10;
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== ヘッダー ===== */
  .header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeInDown 1.2s ease;
  }

  .header .crown {
    font-size: 2.5rem;
    animation: float 4s ease-in-out infinite;
    display: block;
    margin-bottom: 10px;
  }

  .header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 6vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 40%, var(--gold) 60%, #fff8dc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.1em;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(212,175,55,0.5));
  }

  .header .subtitle {
    font-size: clamp(0.75rem, 2.5vw, 1rem);
    color: var(--silver);
    letter-spacing: 0.3em;
    margin-top: 8px;
    text-transform: uppercase;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 20px 0;
    width: 100%;
    max-width: 400px;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
  .divider-star { color: var(--gold); font-size: 1rem; animation: spin-slow 6s linear infinite; }
  @keyframes spin-slow { to { transform: rotate(360deg); } }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== フォームカード ===== */
  .card {
    background: linear-gradient(135deg, rgba(26,10,62,0.85) 0%, rgba(10,14,46,0.9) 100%);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 24px;
    padding: clamp(24px, 5vw, 48px);
    width: 100%;
    max-width: 560px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(107,47,160,0.3), 0 0 120px rgba(107,47,160,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: fadeInUp 1.2s ease 0.3s both;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at center, rgba(212,175,55,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-title {
    text-align: center;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: var(--gold-light);
    margin-bottom: 30px;
    letter-spacing: 0.15em;
    font-weight: 300;
  }

  /* ===== フォーム ===== */
  .form-group {
    margin-bottom: 24px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--silver);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .select-group {
    display: grid;
    grid-template-columns: 2fr 1.5fr 1.5fr;
    gap: 10px;
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    pointer-events: none;
    font-size: 1rem;
  }

  select {
    width: 100%;
    padding: 14px 36px 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 12px;
    color: var(--white);
    font-size: 1rem;
    font-family: 'Noto Serif JP', serif;
    transition: all 0.3s;
    outline: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }

  select:focus {
    border-color: var(--gold);
    background: rgba(212,175,55,0.07);
    box-shadow: 0 0 20px rgba(212,175,55,0.2);
  }

  select option {
    background: #1a0a3e;
    color: var(--white);
  }

  select.placeholder-selected {
    color: rgba(192,192,192,0.5);
  }

  .btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #4a1a8a 0%, var(--violet) 50%, #4a1a8a 100%);
    border: 1px solid var(--gold);
    border-radius: 12px;
    color: var(--gold-light);
    font-size: 1.05rem;
    font-family: 'Noto Serif JP', serif;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
    margin-top: 8px;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.5s;
  }

  .btn:hover::before { left: 100%; }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(107,47,160,0.6), 0 0 20px rgba(212,175,55,0.3);
    background: linear-gradient(135deg, var(--violet) 0%, #8040c0 50%, var(--violet) 100%);
  }

  .btn:active { transform: translateY(0); }

  /* ===== ローディング ===== */
  .loading {
    display: none;
    text-align: center;
    padding: 40px;
  }

  .loading.show { display: block; }

  .crystal-ball {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    position: relative;
    animation: crystal-float 2s ease-in-out infinite;
  }

  .crystal-ball-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c8a8ff, #4a00a0 40%, #0a0030 80%);
    box-shadow: 0 0 40px rgba(107,47,160,0.8), 0 0 80px rgba(107,47,160,0.4), inset 0 0 30px rgba(107,47,160,0.5);
    position: relative;
    overflow: hidden;
  }

  .crystal-ball-shine {
    position: absolute;
    top: 15%; left: 20%;
    width: 30%; height: 20%;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    filter: blur(5px);
  }

  .crystal-swirl {
    position: absolute;
    top: 50%; left: 50%;
    width: 60%; height: 60%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.3), transparent);
    animation: swirl 2s linear infinite;
  }

  @keyframes swirl {
    from { transform: translate(-50%, -50%) rotate(0deg) scale(0.5); opacity: 0.8; }
    to { transform: translate(-50%, -50%) rotate(360deg) scale(1.2); opacity: 0; }
  }

  @keyframes crystal-float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-15px) scale(1.05); }
  }

  .loading-text {
    color: var(--silver);
    letter-spacing: 0.2em;
    font-size: 0.9rem;
    animation: pulse-text 1.5s ease-in-out infinite;
  }

  @keyframes pulse-text {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* ===== 結果 ===== */
  .result {
    display: none;
    width: 100%;
    max-width: 700px;
    animation: fadeInUp 0.8s ease;
  }

  .result.show { display: block; }

  .result-header {
    text-align: center;
    margin-bottom: 30px;
  }

  .result-header h2 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.3rem, 4vw, 2rem);
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  /* タブ */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 6px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--silver);
    cursor: pointer;
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(0.75rem, 2.5vw, 0.95rem);
    letter-spacing: 0.1em;
    transition: all 0.3s;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--purple), var(--violet));
    color: var(--gold-light);
    box-shadow: 0 4px 15px rgba(107,47,160,0.5);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* 結果カード */
  .result-card {
    background: linear-gradient(135deg, rgba(26,10,62,0.9), rgba(10,14,46,0.95));
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 20px;
    padding: clamp(20px, 4vw, 36px);
    margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(107,47,160,0.2);
    position: relative;
    overflow: hidden;
  }

  .result-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    right: 0; height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  /* 数字表示 */
  .number-display {
    text-align: center;
    margin: 20px 0 30px;
    position: relative;
  }

  .life-number {
    font-family: 'Cinzel', serif;
    font-size: clamp(4rem, 15vw, 7rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, #fff8dc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.6));
    animation: number-glow 3s ease-in-out infinite;
  }

  @keyframes number-glow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(212,175,55,0.4)); }
    50% { filter: drop-shadow(0 0 50px rgba(212,175,55,0.9)); }
  }

  .number-label {
    color: var(--silver);
    letter-spacing: 0.3em;
    font-size: 0.8rem;
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* 星座表示 */
  .zodiac-display {
    text-align: center;
    margin: 20px 0 30px;
  }

  .zodiac-symbol {
    font-size: clamp(3.5rem, 12vw, 6rem);
    display: block;
    margin-bottom: 10px;
    animation: float 4s ease-in-out infinite;
  }

  .zodiac-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 5px;
  }

  .zodiac-dates {
    color: var(--silver);
    font-size: 0.85rem;
    letter-spacing: 0.15em;
  }

  /* 属性バッジ */
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0;
    justify-content: center;
  }

  .badge {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    border: 1px solid;
  }

  .badge-fire { background: rgba(255,80,0,0.15); border-color: rgba(255,80,0,0.4); color: #ff9060; }
  .badge-earth { background: rgba(100,180,0,0.15); border-color: rgba(100,180,0,0.4); color: #90c060; }
  .badge-air { background: rgba(100,200,255,0.15); border-color: rgba(100,200,255,0.4); color: #90d8ff; }
  .badge-water { background: rgba(0,100,255,0.15); border-color: rgba(0,100,255,0.4); color: #80b0ff; }
  .badge-gold { background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.4); color: var(--gold-light); }

  /* セクション */
  .section {
    margin-bottom: 24px;
    animation: fadeInUp 0.6s ease both;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    color: var(--gold);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, rgba(212,175,55,0.4), transparent);
  }

  .section-text {
    line-height: 2;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    color: rgba(240,234,248,0.9);
    font-weight: 300;
  }

  /* 運勢メーター */
  .fortune-meters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 16px 0;
  }

  .meter {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .meter-label {
    font-size: 0.75rem;
    color: var(--silver);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .meter-bar {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }

  .meter-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(to right, var(--purple), var(--gold));
    transform-origin: left;
    animation: meter-in 1.5s cubic-bezier(0.17, 0.67, 0.35, 1) both;
  }

  @keyframes meter-in {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  /* 今日のラッキー */
  .lucky-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }

  .lucky-item {
    background: rgba(212,175,55,0.07);
    border: 1px solid rgba(212,175,55,0.2);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
  }

  .lucky-item .icon { font-size: 1.3rem; margin-bottom: 4px; }
  .lucky-item .key { font-size: 0.65rem; color: var(--silver); letter-spacing: 0.1em; text-transform: uppercase; }
  .lucky-item .val { font-size: 0.85rem; color: var(--gold-light); margin-top: 2px; }

  /* やり直しボタン */
  .retry-btn {
    display: block;
    margin: 30px auto 0;
    padding: 12px 36px;
    background: transparent;
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 30px;
    color: var(--silver);
    font-family: 'Noto Serif JP', serif;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.3s;
  }

  .retry-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 20px rgba(212,175,55,0.2);
  }

  /* 粒子エフェクト */
  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    border-radius: 50%;
    animation: particle-rise var(--pd, 4s) ease-out forwards;
  }

  @keyframes particle-rise {
    0% { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
    100% { transform: translateY(-200px) translateX(var(--px, 50px)) scale(0); opacity: 0; }
  }

  /* フッター */
  .footer {
    text-align: center;
    margin-top: 60px;
    color: rgba(192,192,192,0.3);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
  }

  /* レスポンシブ */
  @media (max-width: 480px) {
    .fortune-meters { grid-template-columns: 1fr; }
    .lucky-grid { grid-template-columns: repeat(3, 1fr); }
    .tabs { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- 星空 -->
<canvas id="starfield"></canvas>

<!-- 星雲 -->
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<div class="container">

  <!-- ヘッダー -->
  <div class="header">
    <span class="crown">✦</span>
    <h1>MAXSATORU ORACLE</h1>
    <p class="subtitle">星詠み ✦ 神秘の占い</p>
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-star">✦</span>
      <div class="divider-line"></div>
    </div>
  </div>

  <!-- フォーム -->
  <div class="card" id="formCard">
    <p class="card-title">✦ 生年月日を星に捧げよ ✦</p>
    <div class="form-group">
      <label>あなたの誕生日</label>
      <div class="select-group">
        <div class="select-wrap">
          <select id="sel-year" onchange="updateSelectStyle(this)">
            <option value="">年</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="sel-month" onchange="updateSelectStyle(this)">
            <option value="">月</option>
          </select>
        </div>
        <div class="select-wrap">
          <select id="sel-day" onchange="updateSelectStyle(this)">
            <option value="">日</option>
          </select>
        </div>
      </div>
    </div>
    <button class="btn" onclick="startReading()">✦ 運命を読み解く ✦</button>
  </div>

  <!-- ローディング -->
  <div class="loading" id="loading">
    <div class="crystal-ball">
      <div class="crystal-ball-inner">
        <div class="crystal-ball-shine"></div>
        <div class="crystal-swirl"></div>
      </div>
    </div>
    <p class="loading-text">✦ 星の導きを受け取っています ✦</p>
  </div>

  <!-- 結果 -->
  <div class="result" id="result">
    <div class="result-header">
      <h2 id="resultName"></h2>
      <p id="resultDate" style="color:var(--silver);font-size:0.85rem;letter-spacing:0.15em;"></p>
    </div>

    <!-- タブ -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('numerology', this)">✦ 数秘術</button>
      <button class="tab-btn" onclick="switchTab('zodiac', this)">☽ 星座占い</button>
      <button class="tab-btn" onclick="switchTab('fortune', this)">◈ 総合運</button>
    </div>

    <!-- 数秘術タブ -->
    <div class="tab-content active" id="tab-numerology">
      <div class="result-card">

// ===== 星空Canvas =====
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], shooters = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        speed: Math.random() * 0.5 + 0.2,
        phase: Math.random() * Math.PI * 2,
        maxOpacity: Math.random() * 0.7 + 0.3
      });
    }
    shooters = [];
    for (let i = 0; i < 3; i++) {
      spawnShooter();
    }
  }

  function spawnShooter() {
    shooters.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      vx: 4 + Math.random() * 4,
      vy: 2 + Math.random() * 3,
      life: 1,
      maxLife: 60 + Math.random() * 60,
      frame: 0,
      delay: Math.random() * 300
    });
  }

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    frame++;

    // 星
    stars.forEach(s => {
      const opacity = s.maxOpacity * (0.5 + 0.5 * Math.sin(frame * s.speed * 0.05 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${opacity})`;
      ctx.fill();
    });

    // 流れ星
    shooters.forEach((s, i) => {
      if (s.delay > 0) { s.delay--; return; }
      s.frame++;
      if (s.frame > s.maxLife) {
        shooters[i] = { x: Math.random() * W, y: Math.random() * H * 0.3, vx: 4 + Math.random() * 4, vy: 2 + Math.random() * 3, life: 1, maxLife: 60 + Math.random() * 60, frame: 0, delay: 200 + Math.random() * 300 };
        return;
      }
      const progress = s.frame / s.maxLife;
      const opacity = progress < 0.3 ? progress / 0.3 : 1 - (progress - 0.3) / 0.7;
      const cx = s.x + s.vx * s.frame;
      const cy = s.y + s.vy * s.frame;
      const tailLen = 80;
      const grad = ctx.createLinearGradient(cx - s.vx * tailLen / 5, cy - s.vy * tailLen / 5, cx, cy);
      grad.addColorStop(0, `rgba(255,255,255,0)`);
      grad.addColorStop(1, `rgba(255,255,255,${opacity})`);
      ctx.beginPath();
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.moveTo(cx - s.vx * tailLen / 5, cy - s.vy * tailLen / 5);
      ctx.lineTo(cx, cy);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,220,${opacity})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initStars(); });
  resize();
  initStars();
  draw();
})();

// ===== セレクト初期化 =====
(function initSelects() {
  const now = new Date();
  const currentYear = now.getFullYear();

  // 年（1920〜今年）
  const ySel = document.getElementById('sel-year');
  for (let y = currentYear; y >= 1920; y--) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + '年';
    ySel.appendChild(o);
  }

  // 月
  const mSel = document.getElementById('sel-month');
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement('option');
    o.value = m; o.textContent = m + '月';
    mSel.appendChild(o);
  }

  // 日（月選択で動的更新）
  updateDays();
  mSel.addEventListener('change', updateDays);
  ySel.addEventListener('change', updateDays);

  // プレースホルダースタイル初期化
  [ySel, mSel, document.getElementById('sel-day')].forEach(s => {
    s.classList.add('placeholder-selected');
  });
})();

function updateDays() {
  const y = parseInt(document.getElementById('sel-year').value) || 2000;
  const m = parseInt(document.getElementById('sel-month').value) || 1;
  const maxDay = new Date(y, m, 0).getDate();
  const dSel = document.getElementById('sel-day');
  const prev = dSel.value;
  dSel.innerHTML = '<option value="">日</option>';
  for (let d = 1; d <= maxDay; d++) {
    const o = document.createElement('option');
    o.value = d; o.textContent = d + '日';
    dSel.appendChild(o);
  }
  if (prev && parseInt(prev) <= maxDay) dSel.value = prev;
  updateSelectStyle(dSel);
}

function updateSelectStyle(sel) {
  if (sel.value) {
    sel.classList.remove('placeholder-selected');
  } else {
    sel.classList.add('placeholder-selected');
  }
}

function getBirthdate() {
  const y = document.getElementById('sel-year').value;
  const m = String(document.getElementById('sel-month').value).padStart(2, '0');
  const d = String(document.getElementById('sel-day').value).padStart(2, '0');
  if (!y || !m || m === '00' || !d || d === '00') return null;
  return `${y}-${m}-${d}`;
}

// ===== 数秘術計算 =====
function calcLifePath(dateStr) {
  const digits = dateStr.replace(/-/g, '');
  let sum = digits.split('').reduce((a, b) => a + parseInt(b), 0);
  while (sum > 9 && sum !== 11 && sum !== 22) {
    sum = String(sum).split('').reduce((a, b) => a + parseInt(b), 0);
  }
  return sum;
}

// ===== 星座計算 =====
function getZodiac(month, day) {
  if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return zodiacData[0];
  if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return zodiacData[1];
  if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return zodiacData[2];
  if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return zodiacData[3];
  if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return zodiacData[4];
  if ((month === 5 && day >= 21) || (month === 6 && day <= 21)) return zodiacData[5];
  if ((month === 6 && day >= 22) || (month === 7 && day <= 22)) return zodiacData[6];
  if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return zodiacData[7];
  if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return zodiacData[8];
  if ((month === 9 && day >= 23) || (month === 10 && day <= 23)) return zodiacData[9];
  if ((month === 10 && day >= 24) || (month === 11 && day <= 22)) return zodiacData[10];
  return zodiacData[11];
}

// ===== シード乱数（日付基準で固定）=====
function seededRand(seed, min, max) {
  const x = Math.sin(seed + 1) * 10000;
  const r = x - Math.floor(x);
  return Math.floor(r * (max - min + 1)) + min;
}

function getFortuneValues(dateStr) {
  const seed = parseInt(dateStr.replace(/-/g, ''));
  return {
    love: seededRand(seed * 1, 40, 100),
    money: seededRand(seed * 2, 30, 100),
    work: seededRand(seed * 3, 40, 100),
    health: seededRand(seed * 4, 50, 100),
    luck: seededRand(seed * 5, 35, 100)
  };
}

  }

  document.getElementById('formCard').style.display = 'none';

function shakeInput() {
  const selects = document.querySelectorAll('.select-wrap select');
  selects.forEach(s => {
    if (!s.value) {
      s.style.borderColor = '#ff6060';
      s.style.animation = 'shake 0.5s ease';
      setTimeout(() => {
        s.style.borderColor = '';
        s.style.animation = '';
      }, 600);
    }
  });
}

  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  document.querySelectorAll('.tab-content').forEach((c, i) => c.classList.toggle('active', i === 0));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function launchParticles() {
  const colors = ['#d4af37', '#f5d76e', '#c8a8ff', '#ffffff', '#a0c8ff'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 2;
    p.style.cssText = `
      width:${size}px;height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}vw;top:${Math.random()*30+50}vh;
      --pd:${Math.random()*2+2}s;
      --px:${(Math.random()-0.5)*200}px;
      animation-delay:${Math.random()*0.5}s;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 5000);
  }
}
</script>
</body>
</html>
